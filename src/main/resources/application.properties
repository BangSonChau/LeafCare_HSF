spring.application.name=LeafCare_HSF

spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=leafcare;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:leafcare_app}
# Schema comes from Flyway (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/sqlserver/migration,classpath:db/sqlserver/seed
# DBs created earlier by ddl-auto=update already have the V1 tables: mark them as V1 instead of failing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.password=${DB_PASSWORD}
leafcare.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# lazy so MaxUploadSizeExceededException reaches ScanController's @ExceptionHandler
spring.servlet.multipart.resolve-lazily=true

# Gemini AI & RAG settings (configure GEMINI_API_KEY in environment or application-local.properties)
leafcare.gemini.enabled=${GEMINI_ENABLED:true}
leafcare.gemini.api-key=${GEMINI_API_KEY:}
leafcare.gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}
leafcare.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
leafcare.gemini.embedding-dimension=${GEMINI_EMBEDDING_DIMENSION:768}
leafcare.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:30000}
leafcare.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:1536}
leafcare.gemini.auto-embed-on-startup=${GEMINI_AUTO_EMBED_ON_STARTUP:true}

