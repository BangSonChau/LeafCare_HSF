spring.application.name=LeafCare_HSF

spring.datasource.url=jdbc:postgresql://localhost:5432/leafcare
spring.datasource.username=postgres
# Schema comes from Flyway (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration,classpath:db/seed
# DBs created earlier by ddl-auto=update already have the V1 tables: mark them as V1 instead of failing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.password=${DB_PASSWORD}
leafcare.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# lazy so MaxUploadSizeExceededException reaches ScanController's @ExceptionHandler
spring.servlet.multipart.resolve-lazily=true
# Google login. Real values only from env vars (IntelliJ Run Configuration); never commit them.
# The placeholder default lets the app start without them, but Google login then fails.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:chua-cau-hinh}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:chua-cau-hinh}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Comma-separated Google emails that get the ADMIN role at login.
leafcare.admin-emails=${LEAFCARE_ADMIN_EMAILS:}
# Premium plan: price in VND (LEAFCARE_PREMIUM_PRICE=2000 for a cheap real test) and length in days.
leafcare.premium.price=${LEAFCARE_PREMIUM_PRICE:49000}
leafcare.premium.days=30
# MoMo sandbox. Keys only from env vars (MOMO_PARTNER_CODE, MOMO_ACCESS_KEY, MOMO_SECRET_KEY).
momo.endpoint=https://test-payment.momo.vn
momo.partner-code=${MOMO_PARTNER_CODE:chua-cau-hinh}
momo.access-key=${MOMO_ACCESS_KEY:chua-cau-hinh}
momo.secret-key=${MOMO_SECRET_KEY:chua-cau-hinh}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8080/payments/momo/return}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/payments/momo/ipn}
# payWithATM = MoMo page asks for a (test) ATM card; captureWallet = QR for the MoMo app; payWithCC = Visa/Master.
momo.request-type=${MOMO_REQUEST_TYPE:payWithATM}
# SePay: buyers scan a VietQR of this bank account; SePay calls /payments/sepay/webhook when money arrives.
# bank = short name from https://vietqr.app/banks.json (e.g. MBBank, Vietcombank, TPBank). API key only from env.
sepay.bank=${SEPAY_BANK:chua-cau-hinh}
sepay.account=${SEPAY_ACCOUNT:chua-cau-hinh}
sepay.account-name=${SEPAY_ACCOUNT_NAME:}
sepay.api-key=${SEPAY_API_KEY:chua-cau-hinh}
