<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- pager(page, baseUrl, q): page is a Spring Data Page, baseUrl e.g. '/plants', q the current search ('' if none).
     Hidden when there is a single page. Keeps q on every link. Tap targets are 48px. -->
<nav th:fragment="pager(page, baseUrl, q)" th:if="${page.totalPages > 1}"
     class="mt-6 flex justify-center" aria-label="Phân trang">
    <div class="join">
        <a class="btn join-item h-12 min-w-12 px-4"
           th:classappend="${page.first} ? 'btn-disabled'"
           th:href="${page.first} ? '#' : @{${baseUrl}(page=${page.number - 1}, q=${q ?: ''})}"
           th:attr="aria-disabled=${page.first}">Trước</a>

        <a th:each="i : ${#numbers.sequence(page.number > 2 ? page.number - 2 : 0, page.number + 2 < page.totalPages - 1 ? page.number + 2 : page.totalPages - 1)}"
           class="btn join-item tabular h-12 min-w-12 px-4"
           th:classappend="${i == page.number} ? 'btn-primary'"
           th:href="@{${baseUrl}(page=${i}, q=${q ?: ''})}"
           th:attr="aria-current=${i == page.number} ? 'page'"
           th:text="${i + 1}">1</a>

        <a class="btn join-item h-12 min-w-12 px-4"
           th:classappend="${page.last} ? 'btn-disabled'"
           th:href="${page.last} ? '#' : @{${baseUrl}(page=${page.number + 1}, q=${q ?: ''})}"
           th:attr="aria-disabled=${page.last}">Sau</a>
    </div>
</nav>
</body>
</html>
