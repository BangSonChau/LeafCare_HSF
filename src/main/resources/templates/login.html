<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Đăng nhập</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mx-auto mt-8 max-w-md rounded-xl border border-base-300 bg-base-100 px-6 py-10 text-center">
        <span class="mx-auto grid size-16 place-items-center rounded-xl bg-primary text-primary-content">
            <svg th:replace="~{fragments/brand :: leafMark}"></svg>
        </span>
        <h1 class="mt-4 text-2xl font-bold leading-tight">Đăng nhập LeafCare</h1>
        <p class="mt-2 text-pretty text-base-content/70">Dùng tài khoản Google để lưu lịch sử quét lá và quản lý gói của bạn.</p>

        <p th:if="${param.error}" role="alert"
           class="mt-6 rounded-xl border border-error px-4 py-3 text-sm font-semibold text-error">
            Đăng nhập không thành công. Thử lại nhé.
        </p>

        <a th:href="@{/oauth2/authorization/google}"
           class="btn mt-6 h-12 w-full rounded-full border border-base-300 bg-base-100 px-6 text-base hover:bg-base-200">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="size-5" aria-hidden="true">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
                <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
            </svg>
            Đăng nhập bằng Google
        </a>
    </div>
</section>
</body>
</html>
