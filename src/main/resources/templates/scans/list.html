<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Lịch sử quét</title>
</head>
<body>
<section layout:fragment="content">
    <div class="flex flex-wrap items-center justify-between gap-3">
        <h1 class="text-2xl font-bold leading-tight">Lịch sử quét</h1>
        <a th:href="@{/scans/new}" class="btn btn-primary h-12 rounded-full px-6">Quét lá</a>
    </div>

    <div th:if="${page.empty}" class="mt-8 rounded-xl border border-base-300 bg-base-100 px-6 py-12 text-center">
        <span class="mx-auto grid size-16 place-items-center rounded-xl bg-primary text-primary-content">
            <svg th:replace="~{fragments/brand :: leafMark}"></svg>
        </span>
        <p class="mt-4 text-lg font-bold">Chưa có lượt quét nào</p>
        <p class="mt-1 text-base-content/70">Chụp hoặc chọn một ảnh lá để bắt đầu theo dõi sức khoẻ cây.</p>
        <a th:href="@{/scans/new}" class="btn btn-primary mt-6 h-12 rounded-full px-6">Quét lá đầu tiên</a>
    </div>

    <ul th:unless="${page.empty}" class="mt-6 overflow-hidden rounded-xl border border-base-300 bg-base-100">
        <li th:each="s : ${page.content}" class="border-b border-base-300 last:border-b-0">
            <a th:href="@{/scans/{id}(id=${s.id})}"
               class="flex min-h-20 items-center gap-4 p-3 hover:bg-base-200 md:p-4">
                <img th:src="@{/uploads/{f}(f=${s.imageFileName})}" alt="Ảnh lá" loading="lazy"
                     class="size-16 shrink-0 rounded-lg bg-base-200 object-cover md:size-20">
                <div class="min-w-0 flex-1">
                    <p th:if="${s.note != null}" class="line-clamp-2 break-words font-semibold" th:text="${s.note}">Ghi chú</p>
                    <p th:unless="${s.note != null}" class="font-semibold text-base-content/70">Không có ghi chú</p>
                    <div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1">
                        <span class="whitespace-nowrap text-sm text-base-content/70 tabular"
                              th:text="${#temporals.format(s.createdAt, 'dd/MM/yyyy HH:mm')}">07/11/2026 09:30</span>
                        <span class="badge badge-outline whitespace-nowrap" th:text="${s.status.label}">Chờ phân tích</span>
                    </div>
                    <p sec:authorize="hasRole('ADMIN')" class="mt-1 flex gap-1 text-sm text-base-content/70">
                        <span class="shrink-0">Người quét:</span>
                        <span th:replace="~{scans/list :: owner(${s.owner})}"></span>
                    </p>
                </div>
            </a>
        </li>
    </ul>

    <div th:replace="~{fragments/pagination :: pager(${page}, '/scans', '')}"></div>
</section>

<!-- Owner label for ADMIN views (list and detail). -->
<span th:fragment="owner(o)" class="min-w-0 break-all"
      th:text="${o == null} ? 'Chưa rõ (quét trước khi có đăng nhập)' : (${o.name} != null ? ${o.name} + ' · ' + ${o.email} : ${o.email})">Shin · s@x.com</span>
</body>
</html>
