<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE · LeafCare">LeafCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="min-h-screen flex flex-col bg-base-200 text-base-content font-sans antialiased">

<!-- Top bar: committed clinic-green shell. Nav links + scan button from lg up; below lg the bottom bar takes over. -->
<header class="sticky top-0 z-30 bg-primary text-primary-content">
    <div class="mx-auto flex h-16 max-w-6xl items-center gap-4 px-4 md:px-6">
        <a th:href="@{/}" class="flex shrink-0 items-center gap-3 rounded-lg text-xl font-bold" aria-label="LeafCare, về trang chủ">
            <span class="grid size-10 place-items-center rounded-xl bg-white text-primary">
                <svg th:replace="~{fragments/brand :: leafMark}"></svg>
            </span>
            LeafCare
        </a>

        <nav th:if="${me}" class="ml-2 hidden items-center gap-1 lg:flex" aria-label="Điều hướng chính">
            <a th:href="@{/}" class="nav-top" th:classappend="${currentPath == '/'} ? 'bg-secondary'"
               th:attr="aria-current=${currentPath == '/'} ? 'page'">Trang chủ</a>
            <a th:href="@{/chat}" class="nav-top" th:classappend="${#strings.startsWith(currentPath, '/chat')} ? 'bg-secondary'"
               th:attr="aria-current=${#strings.startsWith(currentPath, '/chat')} ? 'page'">Hỏi đáp</a>
            <a th:href="@{/scans}" class="nav-top"
               th:classappend="${#strings.startsWith(currentPath, '/scans') and currentPath != '/scans/new'} ? 'bg-secondary'"
               th:attr="aria-current=${#strings.startsWith(currentPath, '/scans') and currentPath != '/scans/new'} ? 'page'">Lịch sử</a>
            <a th:href="@{/plants}" class="nav-top" th:classappend="${#strings.startsWith(currentPath, '/plants')} ? 'bg-secondary'"
               th:attr="aria-current=${#strings.startsWith(currentPath, '/plants')} ? 'page'">Cây</a>
            <a th:href="@{/diseases}" class="nav-top" th:classappend="${#strings.startsWith(currentPath, '/diseases')} ? 'bg-secondary'"
               th:attr="aria-current=${#strings.startsWith(currentPath, '/diseases')} ? 'page'">Bệnh</a>
            <a th:href="@{/plans}" class="nav-top"
               th:classappend="${#strings.startsWith(currentPath, '/plans') or #strings.startsWith(currentPath, '/payments')} ? 'bg-secondary'"
               th:attr="aria-current=${#strings.startsWith(currentPath, '/plans')} ? 'page'">Gói</a>
        </nav>

        <div class="ml-auto flex min-w-0 items-center gap-3">
            <a th:if="${me}" th:href="@{/scans/new}"
               class="btn hidden h-11 min-h-11 shrink-0 rounded-full border-0 bg-white px-5 text-secondary hover:bg-base-200 lg:inline-flex"
               th:classappend="${currentPath == '/scans/new'} ? 'ring-2 ring-white/60 ring-offset-2 ring-offset-primary'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true">
                    <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/>
                    <circle cx="12" cy="13" r="3"/>
                </svg>
                Quét lá
            </a>

            <!-- Account menu (no JS needed: <details>). Holds the links the phone bottom bar has no room for. -->
            <details th:if="${me}" class="dropdown dropdown-end" data-close-outside>
                <summary class="flex min-h-12 cursor-pointer list-none items-center gap-2 rounded-full pr-1 [&::-webkit-details-marker]:hidden"
                         aria-label="Tài khoản và menu">
                    <img th:if="${me.avatarUrl}" th:src="${me.avatarUrl}" alt="" referrerpolicy="no-referrer"
                         class="size-10 shrink-0 rounded-full bg-secondary object-cover">
                    <span th:unless="${me.avatarUrl}" aria-hidden="true"
                          class="grid size-10 shrink-0 place-items-center rounded-full bg-secondary font-bold"
                          th:text="${#strings.toUpperCase(#strings.substring(me.name, 0, 1))}">S</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true">
                        <path d="m6 9 6 6 6-6"/>
                    </svg>
                </summary>
                <div class="dropdown-content z-40 mt-2 w-64 overflow-hidden rounded-xl border border-base-300 bg-base-100 text-base-content shadow-[0_8px_24px_rgba(20,38,28,0.16)]">
                    <p class="truncate border-b border-base-300 px-4 py-3 font-semibold" th:text="${me.name}" th:title="${me.name}">Shin</p>
                    <ul class="py-1 text-sm font-semibold">
                        <li class="lg:hidden"><a th:href="@{/plants}" class="flex min-h-11 items-center px-4 hover:bg-base-200">Cây</a></li>
                        <li><a th:href="@{/plans}" class="flex min-h-11 items-center px-4 hover:bg-base-200">Gói của bạn</a></li>
                        <li><a th:href="@{/payments}" class="flex min-h-11 items-center px-4 hover:bg-base-200">Lịch sử giao dịch</a></li>
                        <li sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/admin}" class="flex min-h-11 items-center px-4 hover:bg-base-200">Trang quản trị</a>
                        </li>
                    </ul>
                    <form th:action="@{/logout}" method="post" class="border-t border-base-300 py-1">
                        <button type="submit" class="flex min-h-11 w-full items-center px-4 text-left text-sm font-semibold hover:bg-base-200">
                            Đăng xuất
                        </button>
                    </form>
                </div>
            </details>
            <a th:unless="${me != null or currentPath == '/login'}" th:href="@{/login}"
               class="btn h-10 min-h-10 rounded-full border-0 bg-white px-5 text-secondary hover:bg-base-200">Đăng nhập</a>
        </div>
    </div>
</header>

<main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 pb-32 md:px-6 md:py-8 lg:pb-10">
    <div th:if="${success}" role="status"
         class="mb-4 flex items-center gap-3 rounded-xl border border-base-300 bg-base-100 px-4 py-3">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5 shrink-0 text-primary" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
        </svg>
        <span th:text="${success}">Đã lưu</span>
    </div>
    <div th:if="${error}" role="alert"
         class="mb-4 flex items-center gap-3 rounded-xl border border-error bg-base-100 px-4 py-3 text-error">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5 shrink-0" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
        </svg>
        <span th:text="${error}">Có lỗi xảy ra</span>
    </div>

    <section layout:fragment="content">Nội dung trang</section>
</main>

<footer class="hidden border-t border-base-300 bg-base-100 lg:block">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4 text-sm text-base-content/70">
        <span>LeafCare · Chăm sóc cây qua ảnh lá</span>
        <span>Đồ án FPT</span>
    </div>
</footer>

<!-- Phone/tablet bottom bar (< lg): four tabs and a raised "Quét lá" button in the thumb zone. Cây, Gói, Quản trị live in the account menu. -->
<nav th:if="${me}" class="fixed inset-x-0 bottom-0 z-30 border-t border-base-300 bg-base-100 shadow-[0_-2px_12px_rgba(20,38,28,0.12)] lg:hidden"
     aria-label="Điều hướng chính (điện thoại)">
    <div class="mx-auto grid max-w-md grid-cols-5 items-end px-2 pb-[max(0.5rem,env(safe-area-inset-bottom))] pt-2">
        <a th:href="@{/}" class="flex min-h-12 flex-col items-center justify-center gap-0.5 rounded-lg text-xs"
           th:classappend="${currentPath == '/'} ? 'font-bold text-primary' : 'font-semibold text-base-content/70'"
           th:attr="aria-current=${currentPath == '/'} ? 'page'">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6" aria-hidden="true">
                <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/>
            </svg>
            Trang chủ
        </a>
        <a th:href="@{/chat}" class="flex min-h-12 flex-col items-center justify-center gap-0.5 rounded-lg text-xs"
           th:classappend="${#strings.startsWith(currentPath, '/chat')} ? 'font-bold text-primary' : 'font-semibold text-base-content/70'"
           th:attr="aria-current=${#strings.startsWith(currentPath, '/chat')} ? 'page'">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6" aria-hidden="true">
                <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M8.5 10.5h7M8.5 14h4"/>
            </svg>
            Hỏi đáp
        </a>
        <a th:href="@{/scans/new}"
           class="-mt-7 flex flex-col items-center justify-center gap-0.5 text-xs font-bold text-primary"
           th:attr="aria-current=${currentPath == '/scans/new'} ? 'page'">
            <span class="grid size-16 place-items-center rounded-full border-4 border-base-100 bg-primary text-primary-content shadow-[0_4px_12px_rgba(20,38,28,0.25)] transition-transform duration-150 active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-7" aria-hidden="true">
                    <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/>
                    <circle cx="12" cy="13" r="3"/>
                </svg>
            </span>
            Quét lá
        </a>
        <a th:href="@{/scans}" class="flex min-h-12 flex-col items-center justify-center gap-0.5 rounded-lg text-xs"
           th:classappend="${#strings.startsWith(currentPath, '/scans') and currentPath != '/scans/new'} ? 'font-bold text-primary' : 'font-semibold text-base-content/70'"
           th:attr="aria-current=${#strings.startsWith(currentPath, '/scans') and currentPath != '/scans/new'} ? 'page'">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
            </svg>
            Lịch sử
        </a>
        <a th:href="@{/diseases}" class="flex min-h-12 flex-col items-center justify-center gap-0.5 rounded-lg text-xs"
           th:classappend="${#strings.startsWith(currentPath, '/diseases')} ? 'font-bold text-primary' : 'font-semibold text-base-content/70'"
           th:attr="aria-current=${#strings.startsWith(currentPath, '/diseases')} ? 'page'">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6" aria-hidden="true">
                <path d="M19.4 4.6a4 4 0 0 0-5.7 0L12 6.3l-1.7-1.7a4 4 0 0 0-5.7 5.7L12 17.7l7.4-7.4a4 4 0 0 0 0-5.7Z"/>
                <path d="M12 22v-4"/>
            </svg>
            Bệnh
        </a>
    </div>
</nav>

<script>
// Đóng menu tài khoản khi bấm ra ngoài hoặc nhấn Esc (<details> không tự làm).
document.addEventListener('click', e => document.querySelectorAll('details[data-close-outside][open]')
    .forEach(d => { if (!d.contains(e.target)) d.open = false; }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('details[data-close-outside][open]')
    .forEach(d => { d.open = false; d.querySelector('summary').focus(); }); });
</script>

</body>
</html>
