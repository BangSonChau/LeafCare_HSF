<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE · Quản trị LeafCare">Quản trị LeafCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-base-200 font-sans text-base-content antialiased">

<!-- Admin shell: dark clinic-ink sidebar + white top bar + enamel content. CSS-only drawer on phones (no JS). -->
<div class="drawer lg:drawer-open">
    <input id="admin-drawer" type="checkbox" class="drawer-toggle" aria-label="Mở menu quản trị">

    <div class="drawer-content flex min-h-screen min-w-0 flex-col">
        <header class="sticky top-0 z-20 border-b border-base-300 bg-base-100">
            <div class="flex h-16 items-center gap-3 px-4 md:px-6">
                <label for="admin-drawer" class="btn btn-ghost size-12 min-h-12 p-0 lg:hidden" aria-label="Mở menu">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6" aria-hidden="true">
                        <path d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </label>

                <form th:action="@{/admin/users}" method="get" role="search" class="min-w-0 flex-1 md:max-w-md">
                    <label for="admin-search" class="sr-only">Tìm người dùng theo email hoặc tên</label>
                    <div class="relative">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             class="pointer-events-none absolute left-4 top-1/2 z-10 size-5 -translate-y-1/2 text-base-content/60" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                        </svg>
                        <input id="admin-search" name="q" type="search" maxlength="100" placeholder="Tìm kiếm"
                               class="input h-12 w-full rounded-full bg-base-200 pl-11 text-base">
                    </div>
                </form>

                <div class="ml-auto flex items-center gap-2">
                    <a th:href="@{/}" class="btn btn-ghost hidden h-12 rounded-full px-4 sm:inline-flex">Về LeafCare</a>
                    <img th:if="${me != null and me.avatarUrl != null}" th:src="${me.avatarUrl}" alt="" referrerpolicy="no-referrer"
                         class="size-10 shrink-0 rounded-full bg-base-200 object-cover">
                    <span th:if="${me != null and me.avatarUrl == null}" aria-hidden="true"
                          class="grid size-10 shrink-0 place-items-center rounded-full bg-primary font-bold text-primary-content"
                          th:text="${#strings.toUpperCase(#strings.substring(me.name, 0, 1))}">S</span>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-ghost h-12 rounded-full px-3">Đăng xuất</button>
                    </form>
                </div>
            </div>
        </header>

        <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 md:px-6 md:py-8">
            <div th:if="${success}" role="status"
                 class="mb-4 flex items-center gap-3 rounded-xl border border-base-300 bg-base-100 px-4 py-3">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5 shrink-0 text-primary" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
                </svg>
                <span class="break-words" th:text="${success}">Đã lưu</span>
            </div>
            <div th:if="${error}" role="alert"
                 class="mb-4 flex items-center gap-3 rounded-xl border border-error bg-base-100 px-4 py-3 text-error">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5 shrink-0" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
                </svg>
                <span class="break-words" th:text="${error}">Có lỗi xảy ra</span>
            </div>

            <section layout:fragment="content">Nội dung trang</section>
        </main>
    </div>

    <div class="drawer-side z-30">
        <label for="admin-drawer" class="drawer-overlay" aria-label="Đóng menu"></label>
        <aside class="flex min-h-full w-72 flex-col bg-neutral text-neutral-content">
            <a th:href="@{/admin}" class="flex h-16 items-center gap-3 px-5 text-lg font-bold" aria-label="Quản trị LeafCare">
                <span class="grid size-10 place-items-center rounded-xl bg-white text-primary">
                    <svg th:replace="~{fragments/brand :: leafMark}"></svg>
                </span>
                LeafCare
                <span class="rounded-full bg-primary px-2 py-0.5 text-xs font-semibold text-primary-content">Admin</span>
            </a>

            <nav class="flex-1 px-3 py-4" aria-label="Menu quản trị">
                <p class="px-3 pb-2 text-xs font-semibold uppercase tracking-wide text-neutral-content/70">Quản lý</p>
                <ul class="space-y-1">
                    <li>
                        <a th:href="@{/admin}"
                           class="flex min-h-12 items-center gap-3 rounded-xl px-3 text-sm font-semibold transition-colors duration-150 hover:bg-white/10"
                           th:classappend="${currentPath == '/admin'} ? 'bg-primary text-primary-content hover:bg-primary'"
                           th:attr="aria-current=${currentPath == '/admin'} ? 'page'">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true">
                                <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/>
                                <rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
                            </svg>
                            Tổng quan
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/admin/users}"
                           class="flex min-h-12 items-center gap-3 rounded-xl px-3 text-sm font-semibold transition-colors duration-150 hover:bg-white/10"
                           th:classappend="${#strings.startsWith(currentPath, '/admin/users')} ? 'bg-primary text-primary-content hover:bg-primary'"
                           th:attr="aria-current=${#strings.startsWith(currentPath, '/admin/users')} ? 'page'">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                                <path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>
                            </svg>
                            Người dùng
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/admin/documents}"
                           class="flex min-h-12 items-center gap-3 rounded-xl px-3 text-sm font-semibold transition-colors duration-150 hover:bg-white/10"
                           th:classappend="${#strings.startsWith(currentPath, '/admin/documents')} ? 'bg-primary text-primary-content hover:bg-primary'"
                           th:attr="aria-current=${#strings.startsWith(currentPath, '/admin/documents')} ? 'page'">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true">
                                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2Z"/>
                                <path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h8"/>
                            </svg>
                            Tài liệu RAG
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="border-t border-white/10 p-3">
                <a th:href="@{/}" class="flex min-h-12 items-center gap-3 rounded-xl px-3 text-sm font-semibold hover:bg-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true">
                        <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
                    </svg>
                    Về trang LeafCare
                </a>
            </div>
        </aside>
    </div>
</div>
</body>
</html>
