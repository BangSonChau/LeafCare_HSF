# Test-only config: overrides src/main/resources/application.properties so tests (and CI) need no PostgreSQL.
spring.application.name=LeafCare_HSF
spring.datasource.url=jdbc:h2:mem:leafcare;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Tests build the schema with the real Flyway migrations (no seed data), then Hibernate validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
leafcare.admin-emails=admin@test.com
momo.endpoint=http://momo.test
momo.partner-code=MOMO
momo.access-key=AK
momo.secret-key=secret
momo.redirect-url=http://h/ret
momo.ipn-url=http://h/ipn
momo.request-type=captureWallet
sepay.bank=MBBank
sepay.account=0123456789
sepay.account-name=NGUYEN VAN A
sepay.api-key=test-key
# RAG: H2 has no pgvector and tests must not call Gemini; RagChatService/RagDocumentService are mocked in tests.
spring.ai.vectorstore.type=none
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.google.genai.api-key=test
spring.ai.google.genai.embedding.api-key=test
# Scan model service: ScanClient is mocked in tests, nothing listens here.
leafcare.scan.url=http://scan.test
